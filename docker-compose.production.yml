services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-house-help}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    ports: ['127.0.0.1:4000:4000']
    healthcheck: {test: ['CMD','wget','-qO-','http://localhost:4000/health/ready'], interval: 30s, timeout: 5s, retries: 5}
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
  admin:
    image: ghcr.io/${GITHUB_REPOSITORY:-house-help}/admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
