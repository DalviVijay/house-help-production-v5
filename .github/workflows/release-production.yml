name: Production Release
on:
  workflow_dispatch:
    inputs: {version: {description: 'Release version', required: true}}
permissions: {contents: read, packages: write, id-token: write}
concurrency: {group: production, cancel-in-progress: false}
jobs:
  images:
    runs-on: ubuntu-latest
    environment: production
    strategy: {matrix: {app: [backend, admin]}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.app }}.prod.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ inputs.version }},ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
          provenance: true
          sbom: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: 'ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ inputs.version }}', severity: 'CRITICAL,HIGH', exit-code: '1'}
  migrate:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run prisma:generate -w @house-help/backend
      - run: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma
        env: {DATABASE_URL: '${{ secrets.DATABASE_URL }}'}
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: curl --fail --silent --show-error -X POST '${{ secrets.RENDER_DEPLOY_HOOK }}'
