name: Publish Deploy Images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: staging
      api_url:
        description: Public backend URL embedded in the admin client
        required: true
        default: https://house-help-api-staging.onrender.com
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: infrastructure/docker/backend.prod.Dockerfile
          - name: admin
            dockerfile: infrastructure/docker/admin.prod.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.name == 'admin' && format('NEXT_PUBLIC_API_URL={0}', inputs.api_url) || '' }}
          tags: ghcr.io/dalvivijay/house-help-production/${{ matrix.name }}:${{ inputs.tag }},ghcr.io/dalvivijay/house-help-production/${{ matrix.name }}:latest
          provenance: true
          sbom: true
